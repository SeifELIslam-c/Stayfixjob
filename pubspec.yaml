name: stayfix_job
description: "Stayfix Job helps candidates build profiles, manage availability, apply to opportunities, and communicate with the Stayfix team from one app."

publish_to: 'none' 
version: 1.0.0+12

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  lottie: ^3.1.2

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.0.0
  google_fonts: ^6.3.1
  audioplayers: ^6.5.1
  record: ^6.1.2
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0
  intl: ^0.20.2
  http: ^1.5.0
  http_parser: ^4.0.0
  file_selector: ^1.1.0
  path_provider: ^2.1.2
  open_file: ^3.3.2
  google_sign_in: ^6.2.2
  intl_phone_field: ^3.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  pdfx: ^2.6.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  camera: ^0.11.0
  image_cropper: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # تمت إضافة حزمة الأيقونات
  change_app_package_name: ^1.5.0 # تمت إضافة حزمة تغيير الباكيج

# إعدادات الأيقونة لتطبيق Stayfix Job
flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_background: "#0F63FF"
  adaptive_icon_foreground: "lib/assets/icon/stayfixjob.png"
  image_path: "lib/assets/icon/stayfixjob.png" # تم استخدام المسار الذي أرسلته
  remove_alpha_ios: true

dependency_overrides:
  objective_c: ^9.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/
    - lib/assets/icon/
  fonts:
    - family: Lucide
      fonts:
        - asset: packages/lucide_icons_flutter/assets/lucide.ttf
